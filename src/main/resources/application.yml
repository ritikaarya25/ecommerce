spring:
  datasource:
    url: jdbc:h2:file:./data/orders;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  error:
    include-message: always

app:
  tax-rate: 0.08
  security:
    admin-password: ${ADMIN_PASSWORD:admin123}
    customer-password: ${CUSTOMER_PASSWORD:customer123}
    warehouse-password: ${WAREHOUSE_PASSWORD:warehouse123}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DATABASE_USERNAME:orders}
    password: ${DATABASE_PASSWORD:orders}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update